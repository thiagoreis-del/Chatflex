name: Deploy VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar frontend na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/chatflex-frontend
            git fetch origin main
            git reset --hard origin/main
            npm install --legacy-peer-deps
            NITRO_PRESET=node-server npm run build
            pm2 reload chatflex-frontend
            sleep 3
            curl -fsS -o /dev/null http://localhost:3001 && echo "Deploy OK"
