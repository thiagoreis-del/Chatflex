name: Deploy VPS
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar frontend na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: RELEASE_SHA
          script: |
            set -e
            cd /var/www/chatflex-frontend
            git fetch origin main
            git reset --hard "$RELEASE_SHA"
            npm install --legacy-peer-deps
            NITRO_PRESET=node-server npm run build
            mkdir -p .output/public
            printf '{"commit":"%s"}' "$RELEASE_SHA" > .output/public/deploy-version.json
            pm2 reload chatflex-frontend
            sleep 3
            curl -fsS -o /dev/null http://localhost:3001 && echo "Deploy OK $RELEASE_SHA"
